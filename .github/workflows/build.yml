name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get install -y gcc make

      - name: Build minishell
        run: cd minishell && make

      - name: Build http_server
        run: cd http_server && make

      - name: Build rle_compressor
        run: cd rle_compressor && make

      - name: Build wc_clone
        run: cd wc_clone && make
